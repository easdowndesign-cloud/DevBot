[platformio]
# Build the Mega target when no environment is explicitly selected.
default_envs = megaatmega2560

[env:megaatmega2560]
# ATmega2560 board support and the standard Arduino framework.
platform = atmelavr
board = megaatmega2560
framework = arduino
# Match Serial Monitor to config::kSerialBaud.
monitor_speed = 115200
# External libraries used by drive, LED, debounce, and D10 interrupt adapters.
lib_deps =
  waspinator/AccelStepper@^1.64
  adafruit/Adafruit NeoPixel
  thomasfredericks/Bounce2@^2.71
  nicohood/PinChangeInterrupt@^1.2.9
build_flags =
  # Surface suspicious code during local and CI builds.
  -Wall
  -Wextra
